name: UTUVOWallpaper
options:
  bundleIdPrefix: com.utuvo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: RPNT54P79S
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 3
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  UTUVOWallpaper:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../Sources/PromptTemplates.swift
        group: Shared
      - path: ../Sources/DailyBatch.swift
        group: Shared
      - path: ../Sources/AppLanguage.swift
        group: Shared
      - path: ../Sources/DynamicSchedule.swift
        group: Shared
      - path: ../Sources/DynamicAuto.swift
        group: Shared
      - path: Resources
      - path: Localization
        excludes:
          - "check.py"
      - path: ../Assets/Demo/wallpapers/paper-landscape-demo-5k.jpg
        group: Demo
        buildPhase: resources
      - path: ../Assets/Demo/dynamic/mountain-hours/dawn.jpg
        group: Demo
        buildPhase: resources
      - path: ../Assets/Demo/dynamic/mountain-hours/day.jpg
        group: Demo
        buildPhase: resources
      - path: ../Assets/Demo/dynamic/mountain-hours/dusk.jpg
        group: Demo
        buildPhase: resources
      - path: ../Assets/Demo/dynamic/mountain-hours/night.jpg
        group: Demo
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: UTUVO Wallpaper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations: [zh-Hant, en]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: "UTUVO Wallpaper 用你的大約位置計算日出日落，讓日夜桌布準時切換。位置只存在這支 iPhone。"
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: "UTUVO Wallpaper 會把你選擇的桌布存到照片圖庫。"
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [com.utuvo.wallpaper.daily]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utuvo.wallpaper
        PRODUCT_NAME: UTUVOWallpaper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
  UTUVOWallpaperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: UTUVOWallpaper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utuvo.wallpaper.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/UTUVOWallpaper.app/UTUVOWallpaper
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  UTUVOWallpaper:
    build:
      targets:
        UTUVOWallpaper: all
        UTUVOWallpaperTests: [test]
    test:
      targets:
        - UTUVOWallpaperTests
      gatherCoverageData: false
    run:
      config: Debug
